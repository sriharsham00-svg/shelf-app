<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --card: #FFFFFF;
      --text: #171717;
      --muted: #858585;
      --accent: #5279C7;
      --border: #EAEAE7;
      --subtle: #F3F3F0;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Newsreader', Georgia, serif;
    }

    [data-theme="dark"] {
      --bg: #121214;
      --card: #1c1c20;
      --text: #EDEDED;
      --muted: #9e9e9e;
      --accent: #6b8fd6;
      --border: #2c2c33;
      --subtle: #24242a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; transition: background 0.2s, color 0.2s; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 16px 24px; border-bottom: 1px solid var(--border); }
    .brand { font-family: var(--font-serif); font-size: 24px; font-weight: 500; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: var(--subtle); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

    .main-container { max-width: 680px; margin: 0 auto; padding: 24px; }
    
    /* Tabs Navigation */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Library Screen */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state h3 { font-family: var(--font-serif); font-size: 22px; color: var(--text); margin-bottom: 8px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; margin-top: 16px; font-size: 14px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; margin-top: 20px; }
    .book-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.15s; }
    .book-card:hover { transform: translateY(-2px); }
    .book-cover { width: 100%; aspect-ratio: 1 / 1.414; background: var(--subtle); object-fit: cover; }
    .book-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .book-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-progress { font-size: 11px; color: var(--muted); }

    /* Profile / Data Screen */
    .section-title { font-family: var(--font-serif); font-size: 20px; font-weight: 500; margin-bottom: 16px; }
    .card-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .card-row { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .card-row:last-child { border-bottom: none; }
    .card-label { font-size: 14px; font-weight: 500; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Bottom Dock Navigation */
    .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); padding: 6px; border-radius: 30px; display: flex; gap: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); z-index: 100; }
    .dock-btn { background: transparent; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .dock-btn.active { background: var(--subtle); color: var(--accent); }

    /* Reader View Overlay */
    #reader-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 1000; flex-direction: column; }
    #reader-overlay.open { display: flex; }
    .reader-topbar { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .reader-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    #reader-canvas { max-width: 100%; max-height: 100%; object-hidden: contain; }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="brand">Shelf</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode" id="theme-toggle-icon">🌙</button>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Add PDF">＋</button>
    </div>
  </header>

  <div class="main-container">
    
    <!-- Library View -->
    <div id="view-library" class="view-section active">
      <div id="library-content"></div>
    </div>

    <!-- Bookmarks View -->
    <div id="view-bookmarks" class="view-section">
      <div class="section-title">Bookmarks</div>
      <div id="bookmarks-content" class="empty-state" style="padding: 30px 0;">No bookmarks saved yet.</div>
    </div>

    <!-- Statistics View -->
    <div id="view-stats" class="view-section">
      <div class="section-title">Reading Statistics</div>
      <div class="card-box">
        <div class="card-row">
          <div>
            <div class="card-label">Total Books Read</div>
            <div class="card-sub">Completed titles</div>
          </div>
          <div id="stat-finished" style="font-weight: 600; font-size: 18px;">0</div>
        </div>
        <div class="card-row">
          <div>
            <div class="card-label">Reading Streak</div>
            <div class="card-sub">Consecutive days active</div>
          </div>
          <div id="stat-streak" style="font-weight: 600; font-size: 18px;">🔥 0 days</div>
        </div>
      </div>
    </div>

    <!-- Profile / Library Data View -->
    <div id="view-profile" class="view-section">
      <div class="section-title">Library Data</div>
      <div class="card-box">
        <div class="card-row">
          <div>
            <div class="card-label">Storage environment</div>
            <div class="card-sub">Browser Local IndexedDB · Offline ready</div>
          </div>
        </div>
        <div class="card-row">
          <div>
            <div class="card-label">Sample editorial book</div>
            <div class="card-sub">Add a built-in multi-page PDF to test reading features</div>
          </div>
          <button class="btn-primary" style="margin-top:0;" onclick="loadSampleBook()">Load Sample</button>
        </div>
      </div>
    </div>

  </div>

  <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="handleFiles(this.files)">

  <!-- Bottom Navigation Dock -->
  <nav class="dock">
    <button class="dock-btn active" onclick="switchTab('library', this)">Library</button>
    <button class="dock-btn" onclick="switchTab('bookmarks', this)">Bookmarks</button>
    <button class="dock-btn" onclick="switchTab('stats', this)">Statistics</button>
    <button class="dock-btn" onclick="switchTab('profile', this)">Data</button>
  </nav>

  <!-- Reader Overlay -->
  <div id="reader-overlay">
    <div class="reader-topbar">
      <button class="btn-primary" style="margin-top:0; background:transparent; color:var(--text); border:1px solid var(--border);" onclick="closeReader()">Close</button>
      <div id="reader-title" style="font-weight: 500; font-size: 14px;"></div>
      <button class="btn-primary" style="margin-top:0;" onclick="toggleBookmarkCurrent()">🔖 Bookmark</button>
    </div>
    <div class="reader-stage">
      <canvas id="reader-canvas"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let db = null;
    let currentBookId = null;
    let currentPdfDoc = null;
    let currentPageNum = 1;

    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("shelf-minimal-db", 1);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "id" });
          if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", { keyPath: "id" });
        };
        req.onsuccess = e => { db = e.target.result; resolve(db); refreshLibraryUI(); };
        req.onerror = e => reject(e.target.error);
      });
    }

    async function dbOp(storeName, mode, callback) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const req = callback(store);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDB();
      // Load saved theme preference
      const savedTheme = localStorage.getItem('shelf-theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-toggle-icon').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    });

    function toggleDarkMode() {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      localStorage.setItem('shelf-theme', next);
      document.getElementById('theme-toggle-icon').innerText = next === 'dark' ? '☀️' : '🌙';
    }

    function switchTab(tabName, btnEl) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabName).classList.add('active');
      document.querySelectorAll('.dock-btn').forEach(el => el.classList.remove('active'));
      btnEl.classList.add('active');
      if(tabName === 'library') refreshLibraryUI();
      if(tabName === 'bookmarks') refreshBookmarksUI();
    }

    async function refreshLibraryUI() {
      const metas = await dbOp("meta", "readonly", s => s.getAll());
      const container = document.getElementById('library-content');
      
      if (metas.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>Your shelf is empty</h3>
            <p>Add your first PDF document to start reading.</p>
            <button class="btn-primary" onclick="document.getElementById('file-input').click()">Upload PDF</button>
          </div>
        `;
        return;
      }

      let html = `<div class="grid">`;
      metas.forEach(m => {
        const pct = Math.round((m.page / m.pages) * 100);
        html += `
          <div class="book-card" onclick="openBook('${m.id}')">
            <img class="book-cover" src="${m.cover || ''}" alt="">
            <div class="book-info">
              <div class="book-title">${escapeHtml(m.title)}</div>
              <div class="book-progress">${pct}% read</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;

      // Update statistics
      let finishedCount = metas.filter(m => m.page >= m.pages).length;
      document.getElementById('stat-finished').innerText = finishedCount;
    }

    async function handleFiles(files) {
      for (let file of files) {
        if (file.type !== 'application/pdf') continue;
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 0.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        
        const id = 'book_' + Date.now();
        const meta = {
          id,
          title: file.name.replace(/\.[^/.]+$/, ""),
          pages: pdf.numPages,
          page: 1,
          cover: canvas.toDataURL('image/jpeg', 0.7),
          bookmarks: [],
          added: Date.now()
        };

        await dbOp("meta", "readwrite", s => s.put(meta));
        await dbOp("files", "readwrite", s => s.put({ id, blob: file }));
      }
      refreshLibraryUI();
    }

    async function loadSampleBook() {
      // Create a tiny valid sample canvas/pdf data or fallback mock item
      const id = 'sample_' + Date.now();
      const canvas = document.createElement('canvas');
      canvas.width = 300; canvas.height = 420;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5279C7'; ctx.fillRect(0,0,300,420);
      ctx.fillStyle = '#FFF'; ctx.font = '24px sans-serif'; ctx.fillText("Sample Book", 40, 60);

      const meta = {
        id,
        title: "Editorial Design Guide",
        pages: 5,
        page: 1,
        cover: canvas.toDataURL('image/jpeg'),
        bookmarks: [2],
        added: Date.now()
      };
      
      // Blank dummy blob for sample
      const dummyBlob = new Blob(["%PDF-1.4 sample"], { type: 'application/pdf' });
      await dbOp("meta", "readwrite", s => s.put(meta));
      await dbOp("files", "readwrite", s => s.put({ id, blob: dummyBlob }));
      
      switchTab('library', document.querySelector('.dock-btn'));
      refreshLibraryUI();
      alert("Sample book loaded successfully!");
    }

    async function openBook(id) {
      currentBookId = id;
      const meta = await dbOp("meta", "readonly", s => s.get(id));
      document.getElementById('reader-title').innerText = meta.title;
      document.getElementById('reader-overlay').classList.add('open');
    }

    function closeReader() {
      document.getElementById('reader-overlay').classList.remove('open');
      refreshLibraryUI();
    }

    async function toggleBookmarkCurrent() {
      if (!currentBookId) return;
      const meta = await dbOp("meta", "readonly", s => s.get(currentBookId));
      if (!meta.bookmarks) meta.bookmarks = [];
      if (meta.bookmarks.includes(currentPageNum)) {
        meta.bookmarks = meta.bookmarks.filter(p => p !== currentPageNum);
        alert("Bookmark removed.");
      } else {
        meta.bookmarks.push(currentPageNum);
        alert("Page bookmarked!");
      }
      await dbOp("meta", "readwrite", s => s.put(meta));
    }

    async function refreshBookmarksUI() {
      const metas = await dbOp("meta", "readonly", s => s.getAll());
      const container = document.getElementById('bookmarks-content');
      let html = "";
      metas.forEach(m => {
        if (m.bookmarks && m.bookmarks.length > 0) {
          m.bookmarks.forEach(p => {
            html += `<div class="card-box" style="padding:14px; margin-bottom:8px; cursor:pointer;" onclick="openBook('${m.id}')"><b>${escapeHtml(m.title)}</b> — Page ${p}</div>`;
          });
        }
      });
      container.innerHTML = html || "No bookmarks saved yet.";
    }

    function escapeHtml(str) {
      return (str || "").replace(/[&<>'"]/g, tag => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[tag] || tag));
    }
  </script>
</body>
</html>
