<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --card: #FFFFFF;
      --text: #171717;
      --muted: #858585;
      --accent: #5279C7;
      --border: #EAEAE7;
      --subtle: #F3F3F0;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Newsreader', Georgia, serif;
    }

    [data-theme="dark"] {
      --bg: #121214;
      --card: #1c1c20;
      --text: #EDEDED;
      --muted: #9e9e9e;
      --accent: #6b8fd6;
      --border: #2c2c33;
      --subtle: #24242a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; transition: background 0.2s, color 0.2s; }

    /* Error Console */
    #error-console { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; background: rgba(255, 69, 58, 0.95); color: #fff; padding: 12px; font-family: monospace; font-size: 11px; max-height: 40vh; overflow-y: auto; border-bottom: 2px solid #fff; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 16px 24px; border-bottom: 1px solid var(--border); }
    .brand { font-family: var(--font-serif); font-size: 24px; font-weight: 500; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: var(--subtle); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

    .main-container { max-width: 680px; margin: 0 auto; padding: 24px; }
    
    .view-section { display: none; }
    .view-section.active { display: block; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state h3 { font-family: var(--font-serif); font-size: 22px; color: var(--text); margin-bottom: 8px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; margin-top: 16px; font-size: 14px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; margin-top: 20px; }
    .book-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.15s; }
    .book-card:hover { transform: translateY(-2px); }
    .book-cover { width: 100%; aspect-ratio: 1 / 1.414; background: var(--subtle); object-fit: cover; }
    .book-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .book-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-progress { font-size: 11px; color: var(--muted); }

    .section-title { font-family: var(--font-serif); font-size: 20px; font-weight: 500; margin-bottom: 16px; }
    .card-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .card-row { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .card-row:last-child { border-bottom: none; }
    .card-label { font-size: 14px; font-weight: 500; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); padding: 6px; border-radius: 30px; display: flex; gap: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); z-index: 100; }
    .dock-btn { background: transparent; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .dock-btn.active { background: var(--subtle); color: var(--accent); }

    /* Reader Overlay */
    #reader-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 1000; flex-direction: column; }
    #reader-overlay.open { display: flex; }
    .reader-topbar { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .reader-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; position: relative; padding: 20px; }
    #reader-canvas { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .reader-footer { padding: 12px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--card); }
  </style>
</head>
<body data-theme="light">

  <div id="error-console">
    <b>⚠️ Error:</b> <span id="error-text"></span>
  </div>

  <header>
    <div class="brand">Shelf</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode" id="theme-toggle-icon">🌙</button>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Add PDF">＋</button>
    </div>
  </header>

  <div class="main-container">
    
    <div id="view-library" class="view-section active">
      <div id="library-content"></div>
    </div>

    <div id="view-bookmarks" class="view-section">
      <div class="section-title">Bookmarks</div>
      <div id="bookmarks-content" class="empty-state" style="padding: 30px 0;">No bookmarks saved yet.</div>
    </div>

    <div id="view-stats" class="view-section">
      <div class="section-title">Reading Statistics</div>
      <div class="card-box">
        <div class="card-row">
          <div>
            <div class="card-label">Total Books Read</div>
            <div class="card-sub">Completed titles</div>
          </div>
          <div id="stat-finished" style="font-weight: 600; font-size: 18px;">0</div>
        </div>
        <div class="card-row">
          <div>
            <div class="card-label">Reading Streak</div>
            <div class="card-sub">Consecutive days active</div>
          </div>
          <div id="stat-streak" style="font-weight: 600; font-size: 18px;">🔥 1 day</div>
        </div>
      </div>
    </div>

    <div id="view-profile" class="view-section">
      <div class="section-title">Library Data</div>
      <div class="card-box">
        <div class="card-row">
          <div>
            <div class="card-label">Storage environment</div>
            <div class="card-sub">Browser Local IndexedDB · Offline ready</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="handleFiles(this.files)">

  <nav class="dock">
    <button class="dock-btn active" onclick="switchTab('library', this)">Library</button>
    <button class="dock-btn" onclick="switchTab('bookmarks', this)">Bookmarks</button>
    <button class="dock-btn" onclick="switchTab('stats', this)">Statistics</button>
    <button class="dock-btn" onclick="switchTab('profile', this)">Data</button>
  </nav>

  <!-- Reader View Overlay -->
  <div id="reader-overlay">
    <div class="reader-topbar">
      <button class="btn-primary" style="margin-top:0; background:transparent; color:var(--text); border:1px solid var(--border);" onclick="closeReader()">✕ Close</button>
      <div id="reader-title" style="font-weight: 500; font-size: 14px; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
      <button class="btn-primary" style="margin-top:0;" onclick="toggleBookmarkCurrent()">🔖 Bookmark</button>
    </div>
    <div class="reader-stage">
      <canvas id="reader-canvas"></canvas>
    </div>
    <div class="reader-footer">
      <button class="btn-primary" style="margin-top:0; padding: 6px 12px;" onclick="changePage(-1)">‹ Prev</button>
      <span id="page-indicator" style="font-size: 13px; color: var(--muted);">1 / 1</span>
      <button class="btn-primary" style="margin-top:0; padding: 6px 12px;" onclick="changePage(1)">Next ›</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.getElementById('error-console').style.display = 'block';
      document.getElementById('error-text').innerText = `${msg} (${line}:${col})`;
    };

    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    }

    let db = null;
    let currentBookId = null;
    let currentPdfDoc = null;
    let currentPageNum = 1;
    let totalPages = 1;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("shelf-minimal-db", 1);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "id" });
          if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", { keyPath: "id" });
        };
        req.onsuccess = e => { db = e.target.result; resolve(db); refreshLibraryUI(); };
        req.onerror = e => reject(e.target.error);
      });
    }

    async function dbOp(storeName, mode, callback) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const req = callback(store);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDB();
      const savedTheme = localStorage.getItem('shelf-theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-toggle-icon').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    });

    function toggleDarkMode() {
      const current = document.body.getAttribute('data-theme');
      const next
